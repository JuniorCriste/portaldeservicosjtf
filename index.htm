<style>
    body {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
        background-color: #001219;
    }

.animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            /* Paleta: Navy Blue, Oxford Blue e Midnight Blue */
            background-image: 
                radial-gradient(circle at 0% 0%, hsla(220, 100%, 15%, 1) 0%, transparent 50%),
                radial-gradient(circle at 50% 0%, hsla(230, 80%, 20%, 1) 0%, transparent 50%),
                radial-gradient(circle at 100% 0%, hsla(210, 60%, 25%, 1) 0%, transparent 50%),
                radial-gradient(circle at 0% 50%, hsla(225, 70%, 10%, 1) 0%, transparent 50%),
                radial-gradient(circle at 100% 50%, hsla(215, 50%, 30%, 1) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, hsla(235, 90%, 12%, 1) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, hsla(220, 40%, 20%, 1) 0%, transparent 50%);
            
            background-size: 150% 150%;
            animation: liquid-movement 15s ease infinite alternate;
        }

        /* Animação apenas de posição para evitar mudanças de cor não desejadas */
        @keyframes liquid-movement {
            0% { background-position: 0% 0%; }
            33% { background-position: 100% 20%; }
            66% { background-position: 20% 100%; }
            100% { background-position: 50% 50%; }
        }

    .glass-card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 40px;
        color: white;
        text-align: center;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        max-width: 880px;
        transform: scale(0.98);
        transition: transform 0.2s ease-in-out;
        background: rgba(255, 255, 255, 0.2);
    }

   /* .glass-card:hover {
        background: rgb(231, 241, 254);
        transition: transform 0.2s ease-in-out;
        transition: all 0.3s ease;
    }   */

    h1 { margin-bottom: 10px; font-weight: 300; letter-spacing: 3px; }
    p { opacity: 0.8; font-weight: 300; }
    a { text-decoration: none; }
    img { border-radius: 8px; height: 139px; }
    #cards img {width: 80px; height: 80px;}
    #cards img:hover {
        cursor: pointer;
        animation: tremidinho 0.2s ;
    }

    @keyframes tremidinho {
        0% { transform: translateX(0); }
        25% { transform: translateX(-2px) rotate(-1deg); }
        50% { transform: translateX(2px) rotate(1deg); }
        75% { transform: translateX(-2px) rotate(-1deg); }
        100% { transform: translateX(0); }
    }

    #links {
        display: flex;
        flex-wrap:wrap;
        justify-content: center;
        gap: 10px;
        max-width: 700px;
        margin: 0 auto;
    }

    #links a, #links button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px ;
        white-space: nowrap;
        flex: 0 1 auto;
        background-color: #7fffd4; 
        border-radius: 5px;
        text-decoration: none;
        color: #000;
        font-size: 14px;
        padding-inline: 25px;
    }

    .btnStack {
        font-family: "Montserrat", serif;
        background-color: Aquamarine;
        color: #000;
        display: inline-block;
        padding: 6px 12px;
        font-size: 18px;
        cursor: pointer;
        border: 1px solid transparent;
        border-radius: 4px;
        margin-top: 5px;
        margin-left: 3px;
    }
    
    a.btnStack:hover { background-color: DarkSlateGray; color: white; }

    /* ESTILO DO BOTÃO DE AGENDA COM ANIMAÇÃO */
    .btn-agenda {
        display: block;
        width: 80%;
        margin: 20px auto 0;
        padding: 15px;
        font-family: "Montserrat", sans-serif;
        font-size: 20px;
        font-weight: bold;
        text-transform: uppercase;
        color: #000;
        background-color: #FFDF00;
        border-radius: 10px;
        box-shadow: 0 0 15px rgba(127, 255, 212, 0.5);
        animation: pulse-highlight 4s infinite;
        transition: all 0.3s ease;
    }

    @keyframes pulse-highlight {
        0% { transform: scale(1); box-shadow: 0 0 0px rgba(127, 255, 212, 0.7); }
        50% { transform: scale(1.05); box-shadow: 0 0 25px rgba(127, 255, 212, 1); background-color: #fff; }
        100% { transform: scale(1); box-shadow: 0 0 0px rgba(127, 255, 212, 0.7); }
    }

    .btn-agenda:hover {
        background-color: #001219;
        color: #7fffd4;
        animation: none; /* Para a animação ao passar o mouse para facilitar o clique */
    }

    /* ESTILO DA PESQUISA GOOGLE */
    .google-search-container {
        max-width: 570px;
        margin-top: 15px;
    }
    .google-search-container form {
        display: flex;
        gap: 5px;
        opacity: 0.8;
    }
    .google-search-container input[type="text"] {
        flex-grow: 1;
        padding: 10px;
        border-radius: 4px;
        border: none;
        outline: none;
        font-size: 16px;
    }
    .google-search-container input[type="submit"] {
        font-family: "Montserrat", serif;
        background-color: Aquamarine;
        color: rgb(8, 8, 8);
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
    }
</style>

<link rel="icon" type="image/x-icon" href="Portal/jtf.ico">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<style>
    :root {
        --deep-navy: #000814;
        --navy-blue: #001d3d;
        --highlight-blue: #003566;
        --accent-color: #4cc9f0; /* Turquesa suave */
        --accent-hover: #4361ee; /* Azul vibrante para hover */
        --text-light: #f8f9fa;
    }

    body {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Montserrat', sans-serif;
        overflow: hidden;
        background-color: var(--deep-navy);
        margin: 0;
    }

    /* FUNDO ANIMADO EM TONS DE AZUL MARINHO */
    .animated-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background-image: 
            radial-gradient(at 0% 0%, #000814 0px, transparent 50%),
            radial-gradient(at 50% 0%, #001d3d 0px, transparent 50%),
            radial-gradient(at 100% 0%, #003566 0px, transparent 50%),
            radial-gradient(at 0% 50%, #001d3d 0px, transparent 50%),
            radial-gradient(at 100% 50%, #000814 0px, transparent 50%),
            radial-gradient(at 0% 100%, #003566 0px, transparent 50%),
            radial-gradient(at 100% 100%, #001d3d 0px, transparent 50%);
        background-size: 150% 150%;
        animation: liquid-movement 15s ease infinite alternate;
    }

    @keyframes liquid-movement {
        0% { background-position: 0% 0%; }
        50% { background-position: 100% 100%; }
        100% { background-position: 50% 50%; }
    }

    .glass-card {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 25px;
        padding: 40px;
        color: var(--text-light);
        text-align: center;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        max-width: 880px;
        transform: scale(0.98);
        transition: all 0.4s ease;
    }

    .glass-card:hover {
        transform: scale(1);
        background: rgba(255, 255, 255, 0.06);
        border-color: rgba(76, 201, 240, 0.3);
    }

    h1 { 
        margin-bottom: 20px; 
        font-weight: 200; 
        letter-spacing: 5px; 
        text-transform: uppercase;
        color: var(--accent-color);
    }

    a { text-decoration: none; }
    
    /* Logo Principal */
    .main-logo { 
        border-radius: 12px; 
        height: 120px; 
        margin-bottom: 10px;
        filter: drop-shadow(0 0 10px rgba(76, 201, 240, 0.2));
    }

    /* Ícones do rodapé */
    #cards img {
        width: 70px; 
        height: 70px;
        margin: 5px;
        transition: transform 0.3s ease;
        border: 2px solid rgba(255, 255, 255, 0.1);
    }
    
    #cards img:hover {
        transform: translateY(-5px);
        border-color: var(--accent-color);
        animation: tremidinho 0.2s;
    }

    @keyframes tremidinho {
        0% { transform: translateY(-5px) rotate(0deg); }
        25% { transform: translateY(-5px) rotate(-1deg); }
        75% { transform: translateY(-5px) rotate(1deg); }
        100% { transform: translateY(-5px) rotate(0deg); }
    }

    #links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        max-width: 750px;
        margin: 0 auto;
    }

    .btnStack {
        font-family: "Montserrat", sans-serif;
        background-color: rgba(76, 201, 240, 0.15);
        color: var(--text-light);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 400;
        cursor: pointer;
        border: 1px solid rgba(76, 201, 240, 0.3);
        border-radius: 8px;
        transition: all 0.3s ease;
        backdrop-filter: blur(5px);
    }
    
    .btnStack:hover { 
        background-color: var(--accent-color); 
        color: var(--navy-blue); 
        font-weight: 600;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(76, 201, 240, 0.3);
    }

    /* PESQUISA GOOGLE HARMONIZADA */
    .google-search-container {
        max-width: 600px;
        margin: 25px auto;
    }
    .google-search-container form {
        display: flex;
        gap: 10px;
    }
    .google-search-container input[type="text"] {
        flex-grow: 1;
        padding: 12px 15px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(0, 0, 0, 0.2);
        color: white;
        outline: none;
        font-size: 15px;
    }
    .google-search-container input[type="submit"] {
        background-color: var(--accent-color);
        color: var(--navy-blue);
        border: none;
        padding: 10px 25px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
        transition: 0.3s;
    }
    .google-search-container input[type="submit"]:hover {
        background-color: white;
    }

    /* BOTÃO AGENDA - FOCO HARMONIZADO */
    .btn-agenda {
        display: block;
        width: 100%;
        margin-top: 25px;
        padding: 18px;
        font-family: "Montserrat", sans-serif;
        font-size: 18px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--navy-blue);
        background-color: var(--accent-color);
        border-radius: 12px;
        animation: pulse-highlight 3s infinite;
        transition: all 0.3s ease;
    }

    @keyframes pulse-highlight {
        0% { box-shadow: 0 0 0px rgba(76, 201, 240, 0.4); }
        50% { box-shadow: 0 0 25px rgba(76, 201, 240, 0.7); filter: brightness(1.1); }
        100% { box-shadow: 0 0 0px rgba(76, 201, 240, 0.4); }
    }

    .btn-agenda:hover {
        background-color: white;
        transform: scale(1.02);
        animation: none;
    }
</style>

<body>

    </div>
</body>

<style>
    body {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
        background-color: #001219;
        margin: 0;
    }

    .animated-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        background-image: 
            radial-gradient(at 0% 0%, hsla(200, 100%, 25%, 1) 0px, transparent 50%),
            radial-gradient(at 50% 0%, hsla(220, 80%, 30%, 1) 0px, transparent 50%),
            radial-gradient(at 100% 0%, hsla(180, 100%, 20%, 1) 0px, transparent 50%),
            radial-gradient(at 0% 50%, hsla(240, 60%, 35%, 1) 0px, transparent 50%),
            radial-gradient(at 100% 50%, hsla(190, 90%, 40%, 1) 0px, transparent 50%),
            radial-gradient(at 0% 100%, hsla(210, 100%, 15%, 1) 0px, transparent 50%),
            radial-gradient(at 100% 100%, hsla(160, 100%, 30%, 1) 0px, transparent 50%);
        background-size: 150% 150%;
        animation: liquid-movement 15s ease infinite alternate;
    }

    @keyframes liquid-movement {
        0% { background-position: 0% 0%; filter: hue-rotate(0deg); }
        33% { background-position: 100% 20%; }
        66% { background-position: 20% 100%; filter: hue-rotate(100deg); }
        100% { background-position: 50% 50%; filter: hue-rotate(0deg); }
    }

    .glass-card {
        background: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 20px;
        padding: 30px;
        color: white;
        text-align: center;
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        max-width: 880px;
        transform: scale(0.98);
        transition: transform 0.2s ease-in-out;
    }

    

    /* NOVO BOTÃO DE DESTAQUE */
    .btn-destaque {
        display: inline-block;
        background-color: #ffde59; /* Amarelo vibrante para contraste */
        color: #000;
        font-family: "Montserrat", sans-serif;
        font-weight: 800;
        text-transform: uppercase;
        padding: 15px 40px;
        margin: 15px 0;
        border-radius: 50px;
        text-decoration: none;
        font-size: 20px;
        box-shadow: 0 0 15px rgba(255, 222, 89, 0.5);
        animation: pulse-gold 2s infinite linear;
        transition: all 0.3s ease;
    }

    @keyframes pulse-gold {
        0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 222, 89, 0.7); }
        50% { transform: scale(1.05); box-shadow: 0 0 20px 10px rgba(255, 222, 89, 0); }
        100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 222, 89, 0); }
    }

    .btn-destaque:hover {
        background-color: #fff;
        transform: scale(1.1) !important;
    }

    h1 { margin-bottom: 10px; font-weight: 300; letter-spacing: 3px; font-size: 24px; }
    p { opacity: 0.8; font-weight: 300; }
    a { text-decoration: none; }
    img { border-radius: 8px; height: 120px; }
    #cards img {width: 70px; height: 70px;}
    
    #cards img:hover {
        cursor: pointer;
        animation: tremidinho 0.2s ;
    }

    @keyframes tremidinho {
        0% { transform: translateX(0); }
        25% { transform: translateX(-2px) rotate(-1deg); }
        50% { transform: translateX(2px) rotate(1deg); }
        75% { transform: translateX(-2px) rotate(-1deg); }
        100% { transform: translateX(0); }
    }

    #links {
        display: flex;
        flex-wrap:wrap;
        justify-content: center;
        gap: 10px;
        max-width: 700px;
        margin: 0 auto 20px auto;
    }

    .btnStack {
        font-family: "Montserrat", serif;
        background-color: Aquamarine;
        color: #000;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 15px;
        font-size: 14px;
        cursor: pointer;
        border: 1px solid transparent;
        border-radius: 4px;
        text-decoration: none;
        white-space: nowrap;
    }
    
    a.btnStack:hover { background-color: DarkSlateGray; color: white; }

    .google-search-container {
        max-width: 570px;
        margin: 0 auto 20px auto;
    }
    .google-search-container form {
        display: flex;
        gap: 5px;
        opacity: 0.8;
    }
    .google-search-container input[type="text"] {
        flex-grow: 1;
        padding: 10px;
        border-radius: 4px;
        border: none;
        outline: none;
        font-size: 16px;
    }
    .google-search-container input[type="submit"] {
        font-family: "Montserrat", serif;
        background-color: Aquamarine;
        color: rgb(8, 8, 8);
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
    }
</style>
